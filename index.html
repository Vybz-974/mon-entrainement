  <div class="app-shell">
    <header class="topbar"><span class="mobile-brand">mon entraînement<span>↗</span></span><span class="preview-label">FORCE & MASSE · V2</span><button class="icon-button" data-view="data" aria-label="Ouvrir les sauvegardes">↗</button></header>

  <script>
const LEGACY_KEY = 'muscu_mathieu_v1';
const PREVIEW_KEY = 'muscu_mathieu_v2_preview';
const LEGACY_PLAN = [
  {name:'A · Force développé couché', ex:[['Développé couché barre',4,5,82.5,180],['Presse à cuisses',3,10,'',120],['Tractions pronation',3,9,0,120],['Développé incliné haltères',3,9,'',120],['Extension triceps poulie',3,11,'',90],['Élévations latérales poulie',2,15,4.5,90]]},
  {name:'B · Soulevé de terre et dos', ex:[['Soulevé de terre',3,5,95,180],['Développé militaire haltères',3,9,'',120],['Tractions pronation',3,8,0,120],['Leg curl',3,11,'',90],['Rowing avec appui poitrine',2,10,'',120],['Curl barre EZ',3,11,'',90]]},
  {name:'C · Hypertrophie générale', ex:[['Hack squat ou squat',3,9,'',150],['Développé couché barre',3,8,72.5,150],['Rowing avec appui poitrine',3,11,'',120],['Développé épaules haltères',2,10,'',120],['Curl marteau',2,12,'',90],['Extension triceps au-dessus de la tête',3,12,'',90],['Élévations latérales poulie',2,15,4.5,90]]}
];
const clone = value => JSON.parse(JSON.stringify(value));
const object = v => v !== null && typeof v === 'object' && !Array.isArray(v);
const validNumber = (v,min,max) => (typeof v === 'number' || typeof v === 'string') && v !== '' && Number.isFinite(Number(v)) && +v >= min && +v <= max;
const validDate = v => typeof v === 'string' && Number.isFinite(Date.parse(v));
function assert(ok,message='Sauvegarde invalide. Aucun changement effectué.') { if(!ok) throw Error(message); }
function validateRows(rows) {
  assert(object(rows));
  for(const [key,row] of Object.entries(rows)) {
    assert(/^\d+_\d+$/.test(key) && object(row));
    assert(typeof row.done === 'boolean' && (row.kg === '' || validNumber(row.kg,0,1000)) && validNumber(row.reps,1,100) && Number.isInteger(+row.reps));
  }
}
function validateProgram(program) {
  assert(Array.isArray(program) && program.length === 3,'Le programme doit contenir trois séances.');
  for(const day of program) {
    assert(object(day) && typeof day.name === 'string' && day.name.trim().length > 0 && day.name.length < 120);
    assert(Array.isArray(day.ex) && day.ex.length > 0 && day.ex.length <= 20);
    assert(new Set(day.ex.map(ex=>Array.isArray(ex)?ex[0]:null)).size===day.ex.length,'Utilise un nom distinct pour chaque exercice d’une séance.');
    for(const ex of day.ex) assert(Array.isArray(ex) && typeof ex[0] === 'string' && ex[0].trim().length > 0 && ex[0].length < 120 && Number.isInteger(ex[1]) && ex[1]>=1 && ex[1]<=10 && Number.isInteger(ex[2]) && ex[2]>=1 && ex[2]<=100 && (ex[3]==='' || validNumber(ex[3],0,1000)) && Number.isInteger(ex[4]) && ex[4]>=30 && ex[4]<=600);
  }
  return program;
}
function validateBackup(value) {
  assert(object(value) && object(value.drafts) && Array.isArray(value.history) && Array.isArray(value.weights));
  for(const [day,rows] of Object.entries(value.drafts)) { assert(/^[012]$/.test(day)); validateRows(rows); }
  for(const h of value.history) {
    assert(object(h) && validDate(h.date) && Number.isInteger(h.day) && h.day>=0 && h.day<=2); validateRows(h.rows);
    if(h.snapshot) { assert(object(h.snapshot)); validateProgram([h.snapshot,h.snapshot,h.snapshot]); validateRows(h.snapshot.rows); }
  }
  for(const w of value.weights) assert(object(w) && validDate(w.date) && typeof w.kg==='number' && validNumber(w.kg,25,300));
  if(value.v2 !== undefined) {
    assert(object(value.v2) && value.v2.version===2);
    validateProgram(value.v2.program);
    assert(object(value.v2.active));
    for(const [day,session] of Object.entries(value.v2.active)) {
      assert(/^[012]$/.test(day) && object(session) && object(session.plan));
      validateProgram([session.plan,session.plan,session.plan]); validateRows(session.rows);
    }
    if(value.v2.timer !== null && value.v2.timer !== undefined) assert(object(value.v2.timer) && Number.isFinite(value.v2.timer.end) && value.v2.timer.end>=0);
  }
  return value;
}
const emptyDB = () => ({drafts:{},history:[],weights:[]});
function defaultProgram() {
  const p = clone(LEGACY_PLAN);
  p[0].ex[4][1] = 4;
  // Replace direct shoulder pressing, while preserving the source programme separately.
  p[1].ex[1] = ['Extension triceps poulie',3,12,'',90];
  p[2].ex[3] = ['Leg curl',3,12,'',90];
  return p;
}
function withV2(db) { const copy=clone(db); copy.v2 ||= {version:2,program:defaultProgram(),active:{},timer:null}; return copy; }
function openSession(db,day) {
  const next=withV2(db);
  if(!next.v2.active[day]) {
    const legacy=next.drafts[day];
    next.v2.active[day]={plan:clone(legacy && Object.keys(legacy).length ? LEGACY_PLAN[day] : next.v2.program[day]),rows:clone(legacy||{})};
    if(!legacy || !Object.keys(legacy).length) {
      const s=next.v2.active[day];
      s.plan.ex.forEach((ex,i)=>{const last=lastPerformance(next,ex[0]);if(last){for(let j=0;j<ex[1];j++)s.rows[`${i}_${j}`]={kg:last.rows[0].kg,reps:ex[2],done:false};}});
    }
  }
  return next;
}
function rowFor(session,i,j) { const ex=session.plan.ex[i]; return session.rows[`${i}_${j}`] || {kg:ex[3],reps:ex[2],done:false}; }
function recordSet(db,day,i,j,values,now=Date.now()) {

  assert(ex && j>=0 && j<ex[1]);
  const previous=rowFor(s,i,j),row={...previous,...values}; validateRows({[`${i}_${j}`]:row});
  assert(!row.done || row.kg !== '', 'Renseigne la charge avant de valider (0 pour le poids de corps).');

}
function archiveSession(db,day,now=new Date().toISOString()) {

  assert(s && Object.values(s.rows).some(r=>r.done),'Valide au moins une série.');
  const rows={};
  // V1 reads only its known positional exercise indices. New/replaced exercises live in snapshot.
  for(const [key,row] of Object.entries(s.rows)) {
    const [i,j]=key.split('_').map(Number),name=s.plan.ex[i]?.[0];

  }

  next.drafts[day]={}; delete next.v2.active[day]; next.v2.timer=null;
  return next;
}
function lastPerformance(db,name) {
  const sorted=[...db.history].sort((a,b)=>Date.parse(b.date)-Date.parse(a.date));
  for(const h of sorted) {
    const p=h.snapshot||LEGACY_PLAN[h.day],rows=h.snapshot?.rows||h.rows;
    const i=p.ex.findIndex(ex=>ex[0]===name);
    const done=Object.entries(rows).filter(([k,v])=>+k.split('_')[0]===i && v.done).map(([,v])=>v);
    if(i>=0 && done.length) return {date:h.date,rows:done,expected:p.ex[i][1]};
  }

}
function suggestion(db,ex) {
  const last=lastPerformance(db,ex[0]);
  if(!last) return {kg:ex[3],text:'Première séance : ajuste la charge pour garder 1 à 2 répétitions en réserve.'};
  const kg=+last.rows[0].kg;
  const complete=last.rows.length>=ex[1] && last.rows.every(r=>+r.reps>=ex[2] && +r.kg===kg);
  if(!complete) return {kg,text:'Garde la dernière charge et vise toutes les séries prévues.'};
  if(kg===0) return {kg:0,text:'Objectif atteint : garde le poids de corps et améliore la maîtrise avant de lester.'};
  return {kg,text:`Objectif atteint : essaie +${/couché|terre|squat|presse/i.test(ex[0])?2.5:1} kg si la technique et la récupération le permettent.`};
}
function secondsLeft(timer,now=Date.now()) { return Math.max(0,Math.ceil(((timer?.end||0)-now)/1000)); }
class Store {
  constructor(storage,key=PREVIEW_KEY) {
    this.storage=storage; this.key=key; this.raw=storage.getItem(key);
    this.db=this.raw===null?emptyDB():validateBackup(JSON.parse(this.raw));
  }
  commit(next) {
    validateBackup(next);
    assert(this.storage.getItem(this.key)===this.raw,'Les données ont changé dans un autre onglet. Recharge avant de continuer.');
    // Same-address replacement: keep the exact original bytes before the first V2 write.
    if(this.key===LEGACY_KEY && this.raw!==null && this.storage.getItem(`${LEGACY_KEY}_before_v2`)===null) this.storage.setItem(`${LEGACY_KEY}_before_v2`,this.raw);
    const raw=JSON.stringify(next); this.storage.setItem(this.key,raw);
    this.raw=raw; this.db=next; return next;
  }
}

  }catch(e){error(e.message);}
}
function download(raw,name){const url=URL.createObjectURL(new Blob([raw],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportDB(){if(blocked){error('Utilise « Exporter les données brutes » pour récupérer le contenu illisible sans le modifier.');return;}download(JSON.stringify(db(),null,2),`sauvegarde_musculation_${localDate()}.json`);}
async function restore(value){
  try {
    validateBackup(value);
    if(!await confirmAction(LIVE?'Restaurer cette sauvegarde ?':'Restaurer dans la version d’essai ?',`${value.history.length} séance${value.history.length>1?'s':''} et ${value.weights.length} pesée${value.weights.length>1?'s':''} seront chargées. Les données actuelles seront remplacées ; une copie sera conservée.${LIVE?'':' L’application en ligne reste intacte.'}`,'Restaurer dans la V2'))return;
    if(blocked)throw Error('Le stockage est bloqué. Exporte les données brutes.');
    // Checkpoint must succeed before replacing the preview database.
    if(localStorage.getItem(DATA_KEY)!==store.raw)throw Error('Un autre onglet a modifié les données. Recharge avant de restaurer.');
    localStorage.setItem(`${DATA_KEY}_before_import`,store.raw||JSON.stringify(emptyDB()));
    if(commit(clone(value))){exercise=0;render();toast('Sauvegarde restaurée dans la V2.');}
  }catch(e){error(e.message);}
}
function updateTimer(){
  const timer=db().v2?.timer,remaining=secondsLeft(timer),active=Boolean(timer);
  $('rest-panel').hidden=!active;document.body.classList.toggle('has-rest',active);
  $('clock').textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;
  $('rest-label').textContent=remaining?'Récupération':'Prêt pour la suite';
  const extend=document.querySelector('[data-action="extend-rest"]');if(extend)extend.disabled=blocked;
}
document.addEventListener('click',async event=>{
  const button=event.target.closest('button');if(!button)return;
  if(button.dataset.view){await changeView(button.dataset.view);return;}
  if(button.dataset.day!==undefined){day=+button.dataset.day;exercise=0;render();return;}
  if(button.dataset.exercise!==undefined){exercise=+button.dataset.exercise;render();window.scrollTo({top:150,behavior:'smooth'});return;}
  if(button.dataset.toggle!==undefined){toggleSet(+button.dataset.toggle);return;}
  if(button.dataset.addEx!==undefined){
    const di=+button.dataset.addEx,container=document.querySelector(`[data-program-day="${di}"]`),n=container.children.length;
    if(n>=20){toast('Maximum 20 exercices par séance.');return;}
    container.insertAdjacentHTML('beforeend',programExercise(['Nouvel exercice',3,10,'',90],di,n));programDirty=true;return;
  }
  if(button.dataset.removeEx!==undefined){
    const container=button.closest('.program-exercises');if(container.children.length<=1){toast('Garde au moins un exercice.');return;}
    button.closest('.program-ex').remove();programDirty=true;return;
  }
  try{
    switch(button.dataset.action){
      case 'quick': {const s=session(),j=Array.from({length:s.plan.ex[exercise][1]},(_,j)=>j).find(j=>!rowFor(s,exercise,j).done);if(j!==undefined)toggleSet(j);break;}
      case 'next': if(exercise<session().plan.ex.length-1){exercise++;render();}else document.querySelector('[data-action="finish"]').focus();break;
      case 'finish': {
        const count=progress(session());if(!await confirmAction('Terminer cette séance ?',`${count.done} séries sur ${count.total} seront archivées. ${count.done<count.total?'La séance est partielle ; tu peux aussi annuler pour continuer.':'Tu retrouveras le détail dans ton historique.'}`,'Archiver la séance'))break;
        if(commit(archiveSession(db(),day))){exercise=0;view='history';render();window.scrollTo({top:0});toast('Séance archivée. Beau travail.');}break;
      }
      case 'extend-rest': {const next=withV2(db());next.v2.timer={end:Math.max(Date.now(),next.v2.timer?.end||0)+30000};if(commit(next))updateTimer();break;}
      case 'stop-rest': {const next=withV2(db());next.v2.timer=null;if(commit(next))updateTimer();break;}
      case 'export': exportDB();break;
      case 'export-raw': {const raw=localStorage.getItem(DATA_KEY);if(raw===null){toast('Aucune donnée enregistrée.');break;}download(raw,`donnees_brutes_${localDate()}.json`);break;}
      case 'export-checkpoint': {const raw=localStorage.getItem(`${DATA_KEY}_before_import`);if(!raw){toast('Aucune restauration effectuée pour le moment.');break;}download(raw,'sauvegarde_avant_restauration_v2.json');break;}
      case 'export-before-v2': {const raw=localStorage.getItem(`${LEGACY_KEY}_before_v2`);if(!raw){toast('Aucune copie avant V2 disponible pour le moment.');break;}download(raw,'sauvegarde_avant_v2.json');break;}
      case 'copy-legacy': {const raw=localStorage.getItem(LEGACY_KEY);if(raw)await restore(JSON.parse(raw));break;}
      case 'reset-program': if(await confirmAction('Revenir au programme proposé ?','Seul le programme des prochaines séances sera remplacé. Les séances en cours et l’historique sont conservés.','Rétablir')){const next=withV2(db());next.v2.program=defaultProgram();if(commit(next)){programDirty=false;render();toast('Programme proposé rétabli.');}}break;
    }
  }catch(e){error(e.message);}
});
document.addEventListener('input',event=>{if(event.target.closest('#program-form'))programDirty=true;});
document.addEventListener('change',async event=>{
  const input=event.target;
  if(input.dataset.set!==undefined){
    const j=+input.dataset.set;
    try {const next=recordSet(db(),day,exercise,j,{...collectSet(j),done:rowFor(session(),exercise,j).done});commit(next);}catch(e){error(e.message);}
  }
  if(input.id==='import-file'){
    const file=input.files[0];if(!file)return;
    try{if(file.size>25*1024*1024)throw Error('Ce fichier dépasse 25 Mo.');await restore(JSON.parse(await file.text()));}catch(e){error(e.message);}
    input.value='';
  }
});
document.addEventListener('submit',event=>{
  if(!['weight-form','program-form'].includes(event.target.id))return;event.preventDefault();
  try{
    if(event.target.id==='weight-form'){
      const form=new FormData(event.target),kg=num(form.get('kg')),d=form.get('date');
      if(typeof kg!=='number'||!Number.isFinite(kg)||kg<25||kg>300)throw Error('Indique un poids compris entre 25 et 300 kg.');
      if(!d || d>localDate() || !Number.isFinite(Date.parse(d)))throw Error('Choisis une date valide, aujourd’hui ou avant.');
      const next=clone(db());next.weights.unshift({date:new Date(`${d}T12:00:00`).toISOString(),kg});if(commit(next)){render();toast('Pesée enregistrée.');}
    }else{
      const p=Array.from(document.querySelectorAll('[data-program-day]')).map((container,i)=>({name:event.target.elements[`day-${i}`].value.trim(),ex:Array.from(container.children).map(row=>Array.from(row.querySelectorAll('[data-prop]')).map((input,i)=>i===0?input.value.trim():num(input.value)))}));
      validateProgram(p);
      // Preserve effective old programme for every session with a draft, including imported V1 drafts.
      let next=withV2(db());for(let i=0;i<3;i++)if(Object.keys(next.drafts[i]||{}).length)next=openSession(next,i);
      next.v2.program=p;
      if(commit(next)){programDirty=false;toast('Programme enregistré pour les prochaines séances.');}
    }
  }catch(e){error(e.message);}
});
window.addEventListener('beforeunload',event=>{if(programDirty){event.preventDefault();event.returnValue='';}});
window.addEventListener('storage',event=>{if(event.key===DATA_KEY){blocked=true;error('Les données ont été modifiées dans un autre onglet. Recharge avant de continuer pour préserver les deux versions.');}});
document.addEventListener('visibilitychange',updateTimer);
render();setInterval(updateTimer,250);
if('serviceWorker' in navigator && (location.protocol==='https:' || ['localhost','127.0.0.1'].includes(location.hostname))) navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>toast('Mode hors ligne indisponible pour le moment.'));

</script>
</body>
</html>
